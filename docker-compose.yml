version: '3.8'

services:
  # ----------------------------------------------------------------------------
  # PostgreSQL Database
  # ----------------------------------------------------------------------------
  database:
    image: postgres:16-alpine
    container_name: aspirantos-db
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME:-aspirantos}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-aspirantos_secret_2026}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_NAME:-aspirantos}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - aspirantos-network

  # ----------------------------------------------------------------------------
  # Spring Boot Backend API
  # ----------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aspirantos-backend
    restart: always
    depends_on:
      database:
        condition: service_healthy
    environment:
      DB_HOST: database
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-aspirantos}
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-aspirantos_secret_2026}
      JWT_SECRET: ${JWT_SECRET:-aspirantos-production-super-secret-key-32-chars-long!}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-86400000}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost,http://localhost:4200,http://localhost:80}
    ports:
      - "8080:8080"
    networks:
      - aspirantos-network

  # ----------------------------------------------------------------------------
  # Angular Frontend (Nginx)
  # ----------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: aspirantos-frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "80:80"
    networks:
      - aspirantos-network

volumes:
  postgres_data:
    driver: local

networks:
  aspirantos-network:
    driver: bridge
