services:
  # Spring Boot Backend Web Service
  - type: web
    name: aspirantos-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: oregon
    envVars:
      - key: DB_HOST
        fromDatabase:
          name: aspirantos-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: aspirantos-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: aspirantos-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: aspirantos-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: aspirantos-db
          property: password
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS
        value: "http://localhost:4200,https://*.vercel.app,https://*.onrender.com"

databases:
  # Managed PostgreSQL Database
  - name: aspirantos-db
    databaseName: aspirantos
    user: postgres
    plan: free
    region: oregon
