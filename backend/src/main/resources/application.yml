server:
  port: ${PORT:8080}
  servlet:
    context-path: /

spring:
  application:
    name: AspirantOS

  datasource:
    url: ${SPRING_DATASOURCE_URL:${DATABASE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:aspirantos}}}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:2516}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 20000
      initialization-fail-timeout: -1

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200,https://*.vercel.app,https://*.onrender.com}
  jwt:
    secret: ${JWT_SECRET:aspirantos-development-super-secret-key-32-chars-long!}
    expiration-ms: ${JWT_EXPIRATION:86400000}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
